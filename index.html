<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Guerra 3D - Misiones - GitHub</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: sans-serif; 
        }
        
        #crosshair { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            width: 20px; 
            height: 20px; 
            border: 2px solid red;
            border-radius: 50%; 
            transform: translate(-50%, -50%); 
            pointer-events: none;
            box-shadow: 0 0 10px rgba(255,0,0,0.5);
        }
        
        #ui { 
            position: absolute; 
            bottom: 20px; 
            left: 20px; 
            color: white; 
            font-size: 18px; 
            text-shadow: 2px 2px black;
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
        }
        
        #instrucciones { 
            position: absolute; 
            bottom: 20px; 
            right: 20px; 
            color: #aaa; 
            font-size: 13px; 
            pointer-events: none;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
        
        #mision { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #ffff00; 
            font-size: 16px;
            pointer-events: none;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border: 2px solid #ffff00;
            border-radius: 5px;
            max-width: 300px;
        }
        
        #healthBar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 30px;
            background: #333;
            border: 2px solid #00ff00;
            border-radius: 5px;
            pointer-events: none;
            overflow: hidden;
        }
        
        #healthFill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00);
            transition: width 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }
        
        #misionCompleta {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            color: #00ff00;
            padding: 40px;
            border: 3px solid #00ff00;
            border-radius: 10px;
            text-align: center;
            pointer-events: auto;
            display: none;
            z-index: 1000;
            font-size: 24px;
        }

        #misionCompleta button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            background: #00ff00;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        #misionCompleta button:hover {
            background: #ffff00;
        }

        #adminPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            border: 2px solid #00ff00;
            border-radius: 5px;
            padding: 15px;
            font-size: 12px;
            pointer-events: auto;
            max-width: 300px;
            display: none;
            z-index: 999;
        }

        #adminPanel h3 {
            margin: 0 0 10px 0;
            color: #ffff00;
        }

        #adminPanel button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px;
            background: #00ff00;
            color: black;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
        }

        #adminPanel button:hover {
            background: #ffff00;
        }

        #adminPanel input {
            width: 80%;
            padding: 5px;
            margin: 5px 0;
            background: #222;
            color: #0f0;
            border: 1px solid #00ff00;
            border-radius: 3px;
        }

        #toggleAdmin {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #00ff00;
            color: black;
            border: none;
            padding: 8px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1001;
            display: none;
        }

        #toggleAdmin:hover {
            background: #ffff00;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
</head>
<body>

    <button id="toggleAdmin">ADMIN</button>
    <div id="adminPanel">
        <h3>⚙️ PANEL ADMIN</h3>
        <button onclick="admin.addEnemies(5)">+ 5 Enemigos</button>
        <button onclick="admin.removeAllEnemies()">- Todos Enemigos</button>
        <button onclick="admin.setPlayerHealth(100)">Salud Max</button>
        <button onclick="admin.setPlayerAmmo(999)">Munición ∞</button>
        <button onclick="admin.skipMission()">Saltar Misión</button>
        <button onclick="admin.toggleGodMode()">GodMode: <span id="godModeStatus">OFF</span></button>
        <label>Enemigos en pantalla: <span id="enemyCount">0</span></label><br>
        <label>Velocidad: <input type="range" id="speedSlider" min="0.1" max="1" step="0.1" value="0.25" onchange="admin.setPlayerSpeed(this.value)"></label>
    </div>

    <div id="crosshair"></div>
    <div id="healthBar">
        <div id="healthFill">Salud: 100/100</div>
    </div>
    <div id="ui">
        <div>💀 Bajas: <span id="score">0</span></div>
        <div>🔫 Munición: <span id="ammo">30</span></div>
        <div id="weaponInfo">M4A1 Carbine</div>
    </div>
    <div id="instrucciones">
        <b>CONTROLES:</b><br>
        WASD: Mover | MOUSE: Apuntar<br>
        Click Izquierdo: Disparar | ESPACIO: Saltar<br>
        R: Recargar | ESC: Soltar cursor | F12: Admin
    </div>
    <div id="mision">
        <b>MISIÓN ACTUAL:</b><br>
        <div id="misionTexto">Elimina 10 enemigos</div>
    </div>
    <div id="misionCompleta">
        <div id="mensajeMision"></div>
        <button onclick="cargarSiguienteMision()">Siguiente Misión</button>
    </div>

    <script>
        if (typeof THREE === 'undefined') {
            document.body.innerHTML = '<p style="color:white;padding:20px;">No se cargó Three.js. Comprueba tu conexión o el CDN.</p>';
            throw new Error('Three.js no cargado');
        }

        // --- SISTEMA ADMIN ---
        const admin = {
            godMode: false,
            playerSpeed: 0.25,
            toggleGodMode() {
                this.godMode = !this.godMode;
                document.getElementById('godModeStatus').innerText = this.godMode ? 'ON' : 'OFF';
            },
            addEnemies(count) {
                for (let i = 0; i < count; i++) spawnEnemy();
            },
            removeAllEnemies() {
                enemies.forEach(e => scene.remove(e.mesh));
                enemies.length = 0;
            },
            setPlayerHealth(health) {
                player.health = health;
                actualizarBarraSalud();
            },
            setPlayerAmmo(ammo) {
                player.ammo = ammo;
                document.getElementById('ammo').innerText = player.ammo;
            },
            skipMission() {
                if (misionActual < misiones.length - 1) {
                    cargarSiguienteMision();
                }
            },
            setPlayerSpeed(speed) {
                this.playerSpeed = parseFloat(speed);
            }
        };

        document.getElementById('toggleAdmin').addEventListener('click', () => {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
                e.preventDefault();
                document.getElementById('toggleAdmin').style.display = 
                    document.getElementById('toggleAdmin').style.display === 'none' ? 'block' : 'none';
            }
        });

        // --- CONFIGURACIÓN DEL MUNDO ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 400, 1000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        document.body.appendChild(renderer.domElement);

        // Iluminación mejorada
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 80, 100);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.far = 300;
        dirLight.shadow.camera.left = -200;
        dirLight.shadow.camera.right = 200;
        dirLight.shadow.camera.top = 200;
        dirLight.shadow.camera.bottom = -200;
        scene.add(dirLight);

        // --- GENERACIÓN PROCEDURAL DEL MAPA ---
        function generarMapa() {
            // Terreno con textura
            const floorGeo = new THREE.PlaneGeometry(600, 600, 50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x4a7c3c,
                roughness: 0.8,
                metalness: 0
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            floor.position.y = 0;
            scene.add(floor);

            // Añadir variación al terreno
            const positionAttribute = floorGeo.getAttribute('position');
            for (let i = 0; i < positionAttribute.count; i++) {
                const y = Math.random() * 2;
                positionAttribute.setY(i, positionAttribute.getY(i) + y * 0.1);
            }
            positionAttribute.needsUpdate = true;

            // Montañas de fondo
            const mountainGeo = new THREE.ConeGeometry(80, 120, 32);
            const mountainMat = new THREE.MeshStandardMaterial({ 
                color: 0x6b5d4f,
                roughness: 0.9
            });
            const mountain1 = new THREE.Mesh(mountainGeo, mountainMat);
            mountain1.position.set(-150, 0, -200);
            mountain1.castShadow = true;
            mountain1.receiveShadow = true;
            scene.add(mountain1);

            const mountain2 = new THREE.Mesh(mountainGeo.clone(), mountainMat);
            mountain2.scale.set(0.8, 0.8, 0.8);
            mountain2.position.set(180, 0, -180);
            mountain2.castShadow = true;
            mountain2.receiveShadow = true;
            scene.add(mountain2);

            // Edificios destructibles
            const buildingPositions = [
                { x: -100, z: -80, scale: 1.2 },
                { x: 80, z: -120, scale: 0.9 },
                { x: -60, z: 100, scale: 1.1 },
                { x: 120, z: 60, scale: 0.85 },
                { x: 0, z: 150, scale: 1.0 }
            ];

            buildingPositions.forEach(pos => {
                crearEdificio(pos.x, pos.z, pos.scale);
            });

            // Árboles
            for (let i = 0; i < 25; i++) {
                const x = (Math.random() - 0.5) * 500;
                const z = (Math.random() - 0.5) * 500;
                crearArbol(x, z);
            }

            // Vallas y obstáculos
            for (let i = 0; i < 15; i++) {
                const x = (Math.random() - 0.5) * 500;
                const z = (Math.random() - 0.5) * 500;
                if (Math.random() > 0.5) {
                    crearValla(x, z);
                } else {
                    crearBarricada(x, z);
                }
            }

            // Luces ambientales en edificios
            buildingPositions.forEach(pos => {
                const light = new THREE.PointLight(0xffaa00, 0.5, 50);
                light.position.set(pos.x, 8, pos.z);
                scene.add(light);
            });
        }

        function crearEdificio(x, z, scale) {
            const grupo = new THREE.Group();
            
            // Paredes principales
            const wallGeo = new THREE.BoxGeometry(30 * scale, 25 * scale, 30 * scale);
            const wallMat = new THREE.MeshStandardMaterial({ 
                color: 0xcccccc,
                roughness: 0.6,
                metalness: 0.1
            });
            const walls = new THREE.Mesh(wallGeo, wallMat);
            walls.castShadow = true;
            walls.receiveShadow = true;
            grupo.add(walls);

            // Techo
            const roofGeo = new THREE.ConeGeometry(22 * scale, 10 * scale, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.7 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.y = 17 * scale;
            roof.castShadow = true;
            roof.receiveShadow = true;
            grupo.add(roof);

            // Ventanas
            for (let i = 0; i < 4; i++) {
                const windowGeo = new THREE.BoxGeometry(4 * scale, 4 * scale, 1 * scale);
                const windowMat = new THREE.MeshStandardMaterial({ 
                    color: 0x1a1a2e,
                    metalness: 0.8
                });
                const window = new THREE.Mesh(windowGeo, windowMat);
                window.position.z = 16 * scale;
                window.position.x = -8 * scale + i * 6 * scale;
                window.position.y = 5 * scale;
                grupo.add(window);
            }

            // Puerta
            const doorGeo = new THREE.BoxGeometry(5 * scale, 8 * scale, 1 * scale);
            const doorMat = new THREE.MeshStandardMaterial({ color: 0x4b2f1c, roughness: 0.8 });
            const door = new THREE.Mesh(doorGeo, doorMat);
            door.position.z = 16 * scale;
            door.position.y = 2 * scale;
            grupo.add(door);

            grupo.position.set(x, 0, z);
            scene.add(grupo);
        }

        function crearArbol(x, z) {
            const grupo = new THREE.Group();
            
            // Tronco
            const trunkGeo = new THREE.CylinderGeometry(2, 3, 15, 8);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.8 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.castShadow = true;
            trunk.receiveShadow = true;
            grupo.add(trunk);

            // Follaje
            const foliageGeo = new THREE.SphereGeometry(12, 8, 8);
            const foliageMat = new THREE.MeshStandardMaterial({ color: 0x2d5016, roughness: 0.7 });
            const foliage = new THREE.Mesh(foliageGeo, foliageMat);
            foliage.position.y = 10;
            foliage.castShadow = true;
            foliage.receiveShadow = true;
            grupo.add(foliage);

            grupo.position.set(x, 0, z);
            scene.add(grupo);
        }

        function crearValla(x, z) {
            const grupo = new THREE.Group();
            for (let i = 0; i < 3; i++) {
                const postGeo = new THREE.BoxGeometry(1, 6, 1);
                const postMat = new THREE.MeshStandardMaterial({ color: 0x654321, roughness: 0.8 });
                const post = new THREE.Mesh(postGeo, postMat);
                post.position.x = i * 4;
                post.castShadow = true;
                grupo.add(post);

                const boardGeo = new THREE.BoxGeometry(3.8, 4, 0.5);
                const board = new THREE.Mesh(boardGeo, postMat);
                board.position.x = i * 4 - 2;
                board.position.y = 2;
                grupo.add(board);
            }
            grupo.position.set(x, 0, z);
            scene.add(grupo);
        }

        function crearBarricada(x, z) {
            const barricadaGeo = new THREE.BoxGeometry(15, 5, 2);
            const barricadaMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d, roughness: 0.6 });
            const barricada = new THREE.Mesh(barricadaGeo, barricadaMat);
            barricada.position.set(x, 2.5, z);
            barricada.castShadow = true;
            barricada.receiveShadow = true;
            scene.add(barricada);
        }

        generarMapa();

        // --- CREAR ARMA PROFESIONAL (M4A1) ---
        function crearArmaJugador() {
            const armaGroup = new THREE.Group();

            // Cañón (tubo principal grueso y realista)
            const barrelGeo = new THREE.CylinderGeometry(0.08, 0.08, 1.2, 16);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.95, roughness: 0.15 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.05, 0.08, -0.6);
            barrel.castShadow = true;
            armaGroup.add(barrel);

            // Freno de boca (muzzle brake)
            const brakesGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.15, 12);
            const brakeMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.9, roughness: 0.2 });
            const brake = new THREE.Mesh(brakesGeo, brakeMat);
            brake.rotation.x = Math.PI / 2;
            brake.position.set(0.05, 0.08, -1.15);
            armaGroup.add(brake);

            // Bloque de gas (gas block)
            const gasBlockGeo = new THREE.BoxGeometry(0.15, 0.12, 0.18);
            const gasBlockMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.7, roughness: 0.3 });
            const gasBlock = new THREE.Mesh(gasBlockGeo, gasBlockMat);
            gasBlock.position.set(0, 0.08, -0.2);
            armaGroup.add(gasBlock);

            // Receptor (upper receiver)
            const receiverGeo = new THREE.BoxGeometry(0.22, 0.15, 0.8);
            const receiverMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.75, roughness: 0.25 });
            const receiver = new THREE.Mesh(receiverGeo, receiverMat);
            receiver.position.set(0, 0.02, -0.1);
            armaGroup.add(receiver);

            // Guardamanos (handguard) - modular
            const handguardGeo = new THREE.BoxGeometry(0.12, 0.08, 0.75);
            const handguardMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.5, roughness: 0.4 });
            const handguard = new THREE.Mesh(handguardGeo, handguardMat);
            handguard.position.set(-0.08, -0.05, -0.2);
            armaGroup.add(handguard);

            // Culata (stock) ajustable
            const stockGeo = new THREE.BoxGeometry(0.18, 0.15, 0.5);
            const stockMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.2, roughness: 0.6 });
            const stock = new THREE.Mesh(stockGeo, stockMat);
            stock.position.set(0, -0.05, 0.4);
            armaGroup.add(stock);

            // Almohadilla de culata
            const cheekRestGeo = new THREE.BoxGeometry(0.22, 0.08, 0.08);
            const cheekRest = new THREE.Mesh(cheekRestGeo, stockMat);
            cheekRest.position.set(0, 0.06, 0.35);
            armaGroup.add(cheekRest);

            // Cargador (magazine) - curvo realista
            const magGeo = new THREE.BoxGeometry(0.1, 0.35, 0.08);
            const magMat = new THREE.MeshStandardMaterial({ color: 0x0f0f0f, metalness: 0.6, roughness: 0.4 });
            const mag = new THREE.Mesh(magGeo, magMat);
            mag.position.set(-0.08, -0.2, -0.15);
            mag.rotation.x = 0.05;
            armaGroup.add(mag);

            // Mira frontal (front sight)
            const fsightGeo = new THREE.BoxGeometry(0.03, 0.08, 0.06);
            const sightMat = new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 0.8 });
            const fsight = new THREE.Mesh(fsightGeo, sightMat);
            fsight.position.set(0, 0.12, -0.5);
            armaGroup.add(fsight);

            // Mira trasera (rear sight)
            const rsight = new THREE.Mesh(fsightGeo, sightMat);
            rsight.position.set(0, 0.12, 0.2);
            armaGroup.add(rsight);

            // Acog Scope (mira táctica)
            const scopeBodyGeo = new THREE.BoxGeometry(0.05, 0.08, 0.3);
            const scopeMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.85, roughness: 0.15 });
            const scopeBody = new THREE.Mesh(scopeBodyGeo, scopeMat);
            scopeBody.position.set(0.02, 0.15, -0.15);
            armaGroup.add(scopeBody);

            // Lente de scope
            const scopeLensGeo = new THREE.SphereGeometry(0.04, 12, 12);
            const lensMat = new THREE.MeshStandardMaterial({ color: 0x4a90e2, metalness: 0.9, roughness: 0.2, emissive: 0x1a3a5a });
            const scopeLens = new THREE.Mesh(scopeLensGeo, lensMat);
            scopeLens.position.set(0.02, 0.15, -0.35);
            armaGroup.add(scopeLens);

            // Sistema de raíles (picatinny rail)
            for (let i = 0; i < 5; i++) {
                const railGeo = new THREE.BoxGeometry(0.22, 0.01, 0.08);
                const railMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, metalness: 0.8, roughness: 0.2 });
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.set(0, 0.18, -0.3 + i * 0.15);
                armaGroup.add(rail);
            }

            // Grip (empuñadura pistola)
            const gripGeo = new THREE.BoxGeometry(0.08, 0.18, 0.1);
            const gripMat = new THREE.MeshStandardMaterial({ color: 0x2d2d2d, roughness: 0.8 });
            const grip = new THREE.Mesh(gripGeo, gripMat);
            grip.position.set(-0.02, -0.15, 0);
            grip.rotation.z = -0.3;
            armaGroup.add(grip);

            // Trigger guard
            const triggerGeo = new THREE.TorusGeometry(0.04, 0.015, 8, 8);
            const trigger = new THREE.Mesh(triggerGeo, sightMat);
            trigger.position.set(-0.02, -0.08, -0.05);
            trigger.rotation.x = Math.PI / 2;
            armaGroup.add(trigger);

            // Charging handle (manivela)
            const chargeGeo = new THREE.BoxGeometry(0.04, 0.04, 0.12);
            const charge = new THREE.Mesh(chargeGeo, receiverMat);
            charge.position.set(0.15, 0.08, -0.2);
            armaGroup.add(charge);

            // Muzzle flash effect
            const flashGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const muzzle = new THREE.Mesh(flashGeo, flashMat);
            muzzle.position.set(0.05, 0.08, -1.25);
            muzzle.visible = false;
            armaGroup.add(muzzle);

            const muzzleLight = new THREE.PointLight(0xffaa44, 2, 8);
            muzzleLight.position.set(0.05, 0.08, -1.25);
            muzzleLight.visible = false;
            armaGroup.add(muzzleLight);

            armaGroup.userData = { muzzle: muzzle, muzzleLight: muzzleLight };
            armaGroup.position.set(0.35, -0.15, -0.85);
            armaGroup.scale.set(0.85, 0.85, 0.85);

            return armaGroup;
        }

        // --- SISTEMA DE JUGADOR ---
        let player = {
            pos: { x: 0, z: 5 },
            rot: { x: 0, y: 0 },
            health: 100,
            maxHealth: 100,
            ammo: 30,
            maxAmmo: 30,
            score: 0
        };

        let weaponRecoil = 0;
        let weaponSwayX = 0;
        let weaponSwayY = 0;
        let swayTimer = 0;

        const armaJugador = crearArmaJugador();
        camera.add(armaJugador);

        const shells = [];

        let keys = {};
        let isJumping = false;
        let velocity = { y: 0 };

        window.addEventListener('click', () => {
            if (document.pointerLockElement !== document.body) {
                document.body.requestPointerLock();
            }
        });

        window.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                player.rot.y -= e.movementX * 0.005;
                player.rot.x -= e.movementY * 0.005;
                player.rot.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2.5, player.rot.x));

                weaponSwayX = THREE.MathUtils.clamp(weaponSwayX - e.movementX * 0.0006, -0.06, 0.06);
                weaponSwayY = THREE.MathUtils.clamp(weaponSwayY - e.movementY * 0.0006, -0.04, 0.04);
            }
        });

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'KeyR') recargar();
            if (e.code === 'Escape') document.exitPointerLock();
        });
        window.addEventListener('keyup', (e) => { keys[e.code] = false; });

        // --- SISTEMA DE BALAS ---
        const bullets = [];

        window.addEventListener('mousedown', (e) => {
            if (document.pointerLockElement !== document.body || e.button !== 0) return;
            if (player.ammo <= 0) return;

            const bulletGeo = new THREE.SphereGeometry(0.05, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
            bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(2));

            bullet.userData = { dir: dir.clone(), speed: 3.6, life: 300, damage: 25 };
            bullets.push(bullet);
            scene.add(bullet);

            player.ammo--;
            document.getElementById('ammo').innerText = player.ammo;

            weaponRecoil = Math.min(weaponRecoil + 0.28, 0.55);
            if (armaJugador && armaJugador.userData && armaJugador.userData.muzzle) {
                armaJugador.userData.muzzle.visible = true;
                armaJugador.userData.muzzleLight.visible = true;
                setTimeout(() => {
                    armaJugador.userData.muzzle.visible = false;
                    armaJugador.userData.muzzleLight.visible = false;
                }, 80);
            }

            camera.userData = camera.userData || {};
            camera.userData.shake = 0.15;

            const shellGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.06, 8);
            const shellMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.7, roughness: 0.2 });
            const shell = new THREE.Mesh(shellGeo, shellMat);
            const ejectionPos = new THREE.Vector3(0.12, -0.06, 0.1).applyMatrix4(armaJugador.matrixWorld);
            shell.position.copy(ejectionPos);
            shell.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
            shell.userData = {
                vel: new THREE.Vector3(0.7 + Math.random()*0.5, 0.9 + Math.random()*0.7, -0.3 + Math.random()*0.5).applyQuaternion(camera.quaternion),
                life: 200
            };
            shell.castShadow = true;
            scene.add(shell);
            shells.push(shell);
        });

        function recargar() {
            player.ammo = player.maxAmmo;
            document.getElementById('ammo').innerText = player.ammo;
        }

        // --- CREAR SOLDADO ENEMIGO ---
        function crearPersonaje(posX, posZ) {
            const grupo = new THREE.Group();

            const bodyGeo = new THREE.CapsuleGeometry(0.6, 1.8, 4, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2d5016 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.castShadow = true;
            body.receiveShadow = true;
            grupo.add(body);

            const helmetGeo = new THREE.SphereGeometry(0.55, 8, 8);
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x1a3a0a });
            const helmet = new THREE.Mesh(helmetGeo, helmetMat);
            helmet.position.y = 1.4;
            helmet.castShadow = true;
            helmet.receiveShadow = true;
            grupo.add(helmet);

            const faceGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const faceMat = new THREE.MeshStandardMaterial({ color: 0xd4a574 });
            const face = new THREE.Mesh(faceGeo, faceMat);
            face.position.set(0, 1.3, 0.3);
            face.castShadow = true;
            face.receiveShadow = true;
            grupo.add(face);

            const armGeo = new THREE.CapsuleGeometry(0.3, 1.2, 4, 6);
            const armMat = new THREE.MeshStandardMaterial({ color: 0x2d5016 });

            const armLeft = new THREE.Mesh(armGeo, armMat);
            armLeft.position.set(-0.8, 0.5, 0);
            armLeft.castShadow = true;
            grupo.add(armLeft);

            const armRight = new THREE.Mesh(armGeo, armMat);
            armRight.position.set(0.8, 0.5, 0);
            armRight.castShadow = true;
            grupo.add(armRight);

            const legGeo = new THREE.CapsuleGeometry(0.25, 1.2, 4, 6);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1a3a0a });

            const legLeft = new THREE.Mesh(legGeo, legMat);
            legLeft.position.set(-0.4, -1, 0);
            legLeft.castShadow = true;
            grupo.add(legLeft);

            const legRight = new THREE.Mesh(legGeo, legMat);
            legRight.position.set(0.4, -1, 0);
            legRight.castShadow = true;
            grupo.add(legRight);

            const rifleGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.8, 12);
            const rifleMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.8 });
            const rifle = new THREE.Mesh(rifleGeo, rifleMat);
            rifle.position.set(0.7, 0.4, -0.3);
            rifle.rotation.z = Math.PI / 3.5;
            rifle.castShadow = true;
            grupo.add(rifle);

            grupo.position.set(posX, 0, posZ);
            grupo.castShadow = true;

            return {
                mesh: grupo,
                health: 100,
                maxHealth: 100,
                armLeft: armLeft,
                armRight: armRight,
                legLeft: legLeft,
                legRight: legRight,
                rifle: rifle,
                walkCycle: 0
            };
        }

        // --- SISTEMA DE MISIONES ---
        const misiones = [
            { nombre: "Reconocimiento", objetivo: 10, descripcion: "Elimina 10 soldados enemigos" },
            { nombre: "Asalto Táctico", objetivo: 20, descripcion: "Elimina 20 soldados enemigos" },
            { nombre: "Operación Especial", objetivo: 50, descripcion: "Elimina 50 soldados enemigos" }
        ];

        let misionActual = 0;
        let enemigosEliminados = 0;

        function actualizarMision() {
            const mision = misiones[misionActual];
            document.getElementById('misionTexto').innerHTML = `
                <b>${mision.nombre}</b><br>
                ${mision.descripcion}<br>
                Progreso: ${enemigosEliminados}/${mision.objetivo}
            `;

            if (enemigosEliminados >= mision.objetivo) {
                completarMision();
            }
        }

        function completarMision() {
            const mision = misiones[misionActual];
            document.getElementById('mensajeMision').innerHTML = `
                ✓ ¡MISIÓN COMPLETADA!<br><br>
                ${mision.nombre}<br>
                Soldados eliminados: ${enemigosEliminados}
            `;
            document.getElementById('misionCompleta').style.display = 'block';
        }

        function cargarSiguienteMision() {
            if (misionActual < misiones.length - 1) {
                misionActual++;
                enemigosEliminados = 0;
                document.getElementById('misionCompleta').style.display = 'none';
                
                const enemigosActuales = Math.min(15 + misionActual * 5, 50);
                while (enemies.length < enemigosActuales) {
                    spawnEnemy();
                }
                actualizarMision();
            } else {
                document.getElementById('mensajeMision').innerHTML = `
                    ¡TODAS LAS MISIONES COMPLETADAS!<br><br>
                    Eres un verdadero soldado de élite.
                `;
                document.getElementById('misionCompleta').querySelector('button').style.display = 'none';
            }
        }

        // --- SISTEMA DE ENEMIGOS ---
        const enemies = [];

        function spawnEnemy() {
            const personaje = crearPersonaje(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 300 - 60
            );

            enemies.push(personaje);
            scene.add(personaje.mesh);
        }

        for (let i = 0; i < 15; i++) spawnEnemy();
        actualizarMision();

        // --- FUNCIONES DE DAÑO ---
        function dañarJugador(cantidad) {
            if (admin.godMode) return;
            
            player.health -= cantidad;
            actualizarBarraSalud();

            if (player.health <= 0) {
                alert(`¡GAME OVER! Fuiste derrotado.\nScore: ${player.score}\nMisión: ${misiones[misionActual].nombre}`);
                location.reload();
            }
        }

        function dañarEnemigo(enemigo, cantidad) {
            enemigo.health -= cantidad;

            if (enemigo.health <= 0) {
                scene.remove(enemigo.mesh);
                enemies.splice(enemies.indexOf(enemigo), 1);
                
                player.score++;
                enemigosEliminados++;
                document.getElementById('score').innerText = player.score;
                actualizarMision();

                spawnEnemy();
            }
        }

        function actualizarBarraSalud() {
            const porcentaje = Math.max(0, (player.health / player.maxHealth) * 100);
            document.getElementById('healthFill').style.width = porcentaje + '%';
            document.getElementById('healthFill').innerText = `Salud: ${Math.max(0, Math.round(player.health))}/${player.maxHealth}`;
            
            if (player.health > 75) {
                document.getElementById('healthFill').style.background = 'linear-gradient(90deg, #00ff00, #ffff00)';
            } else if (player.health > 40) {
                document.getElementById('healthFill').style.background = 'linear-gradient(90deg, #ffff00, #ff6600)';
            } else {
                document.getElementById('healthFill').style.background = 'linear-gradient(90deg, #ff0000, #990000)';
            }
        }

        // --- BUCLE DE JUEGO ---
        function animate() {
            requestAnimationFrame(animate);

            document.getElementById('enemyCount').innerText = enemies.length;

            const speed = admin.playerSpeed;
            const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rot.y).normalize();
            const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rot.y).normalize();

            const isMoving = keys['KeyW'] || keys['KeyA'] || keys['KeyS'] || keys['KeyD'];

            if (keys['KeyW']) { player.pos.x += forward.x * speed; player.pos.z += forward.z * speed; }
            if (keys['KeyS']) { player.pos.x -= forward.x * speed; player.pos.z -= forward.z * speed; }
            if (keys['KeyA']) { player.pos.x -= side.x * speed; player.pos.z -= side.z * speed; }
            if (keys['KeyD']) { player.pos.x += side.x * speed; player.pos.z += side.z * speed; }

            if (keys['Space'] && !isJumping) {
                velocity.y = 0.15;
                isJumping = true;
            }
            velocity.y -= 0.01;
            let playerY = 1.6 + velocity.y;
            if (playerY <= 1.6) {
                playerY = 1.6;
                velocity.y = 0;
                isJumping = false;
            }

            camera.position.set(player.pos.x, playerY, player.pos.z);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rot.y;
            camera.rotation.x = player.rot.x;

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.addScaledVector(b.userData.dir, b.userData.speed);
                b.userData.life--;

                for (let j = enemies.length - 1; j >= 0; j--) {
                    const e = enemies[j];
                    if (b.position.distanceTo(e.mesh.position) < 2) {
                        dañarEnemigo(e, b.userData.damage);
                        if (bullets[i]) {
                            scene.remove(b);
                            bullets.splice(i, 1);
                        }
                        break;
                    }
                }

                if (b.userData.life <= 0 && bullets[i]) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            for (let i = shells.length - 1; i >= 0; i--) {
                const s = shells[i];
                s.userData.vel.y -= 0.02;
                s.position.addScaledVector(s.userData.vel, 1);
                s.rotation.x += 0.2;
                s.rotation.z += 0.15;
                s.userData.life--;
                if (s.userData.life <= 0) {
                    scene.remove(s);
                    shells.splice(i, 1);
                }
            }

            enemies.forEach((e, idx) => {
                const dirToPlayer = new THREE.Vector3(player.pos.x, 1, player.pos.z).sub(e.mesh.position).normalize();
                e.mesh.position.addScaledVector(dirToPlayer, 0.04);

                e.walkCycle += 0.05;
                e.armLeft.rotation.z = Math.sin(e.walkCycle) * 0.5;
                e.armRight.rotation.z = -Math.sin(e.walkCycle) * 0.5;
                e.legLeft.rotation.x = Math.sin(e.walkCycle) * 0.3;
                e.legRight.rotation.x = -Math.sin(e.walkCycle) * 0.3;

                e.rifle.rotation.x = Math.sin(e.walkCycle) * 0.2;

                const distancia = e.mesh.position.distanceTo(camera.position);
                if (distancia < 2) {
                    dañarJugador(0.5);
                }
            });

            swayTimer += 0.04;
            const idleSwayX = Math.sin(swayTimer * 0.9) * 0.008;
            const idleSwayY = Math.sin(swayTimer * 1.3) * 0.005;
            const moveBob = isMoving ? Math.sin(swayTimer * 6) * 0.02 : 0;

            weaponSwayX *= 0.92;
            weaponSwayY *= 0.92;

            const targetX = 0.35 + idleSwayX + weaponSwayX;
            const targetY = -0.15 + idleSwayY + weaponSwayY + moveBob;
            armaJugador.position.x += (targetX - armaJugador.position.x) * 0.18;
            armaJugador.position.y += (targetY - armaJugador.position.y) * 0.18;

            if (weaponRecoil > 0.001) {
                armaJugador.position.z += (-0.85 - armaJugador.position.z) * 0.45;
                armaJugador.position.z = -0.85 - weaponRecoil;
                armaJugador.rotation.x = -weaponRecoil * 0.95;
                weaponRecoil *= 0.76;
            } else {
                armaJugador.position.z += (-0.85 - armaJugador.position.z) * 0.18;
                armaJugador.rotation.x += (0 - armaJugador.rotation.x) * 0.12;
                weaponRecoil = 0;
            }

            if (camera.userData && camera.userData.shake) {
                camera.userData.shake *= 0.82;
                const s = camera.userData.shake;
                camera.position.x += (Math.random() - 0.5) * s * 0.02;
                camera.position.y += (Math.random() - 0.5) * s * 0.02;
                camera.rotation.z += (Math.random() - 0.5) * s * 0.006;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        actualizarBarraSalud();
        animate();
    </script>
</body>
</html>
