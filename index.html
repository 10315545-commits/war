<!DOCTYPE html>
<html>
<head>
<title>Juego de Disparos</title>
<style>
body{margin:0;background:black;overflow:hidden;}
#player{
width:40px;
height:40px;
background:lime;
position:absolute;
bottom:20px;
left:50%;
}
.bullet{
width:6px;
height:12px;
background:yellow;
position:absolute;
}
.enemy{
width:30px;
height:30px;
background:red;
position:absolute;
top:0;
}
</style>
</head>

<body>

<div id="player"></div>

<script>

let player=document.getElementById("player")
let px=window.innerWidth/2
player.style.left=px+"px"

let bullets=[]
let enemies=[]

document.addEventListener("keydown",e=>{
if(e.key=="ArrowLeft") px-=20
if(e.key=="ArrowRight") px+=20

if(e.key==" "){
let b=document.createElement("div")
b.className="bullet"
b.style.left=(px+17)+"px"
b.style.top=(window.innerHeight-60)+"px"
document.body.appendChild(b)
bullets.push(b)
}

player.style.left=px+"px"
})

function spawnEnemy(){
let e=document.createElement("div")
e.className="enemy"
e.style.left=Math.random()*window.innerWidth+"px"
document.body.appendChild(e)
enemies.push(e)
}

setInterval(spawnEnemy,1000)

function gameLoop(){

bullets.forEach((b,i)=>{
b.style.top=(b.offsetTop-10)+"px"
})

enemies.forEach((e,i)=>{
e.style.top=(e.offsetTop+3)+"px"
})

requestAnimationFrame(gameLoop)
}

gameLoop()

</script>

</body>
